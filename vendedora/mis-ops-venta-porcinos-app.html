<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mis Operaciones — Venta Porcinos · App</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════════════════════════
   MIS OPERACIONES · VENTA PORCINOS — App
   Reconstruido contra los PDF vectoriales del Figma mobile:
   Home · Filters · Vendidas · A cargar · Cargadas · Faenadas ·
   Operaciones con Saldo · Cerradas · Modals Faena Mobile.
   Los datos y las reglas de negocio son los mismos que el
   prototipo web (ver PROTOTYPE_NOTES § 2.3 y la comparativa).
   Frame de referencia: 360×800.
   ══════════════════════════════════════════════════════════════ */
:root{
  --brand:#3179A7; --brand-dark:#1C4E79; --brand-light:#DAEDF7; --dcp:#1795D0;
  --bg-page:#EDEDED; --bg-1:#FFFFFF; --bg-2:#F8F8F8;
  --g100:#EDEDED; --g200:#E8E8E8; --g300:#C0C0C0; --g400:#A4A4A4;
  --g500:#888888; --g600:#777777; --g700:#666666; --g800:#555555;
  --verde50:#E0EFD8; --verde100:#54A228; --verde200:#1E721E; --verde-wa:#4CA22F;
  --rojo:#D25859; --amar-bg:#FDFCF9; --amar-bd:#E7E0B4; --amar-tx:#6B5E10;
  /* Typescale del export mobile */
  --t1:16px; --l1:19px;   /* título de card */
  --t2:15px; --l2:18px;   /* valor de fecha */
  --t3:14px; --l3:17px;   /* valor fuerte */
  --b1:13px; --lb1:16px;  /* cuerpo */
  --b2:12px; --lb2:14px;  /* labels */
  --cap:11px; --lcap:13px;
  --mic:10px;
  --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:16px; --sp-xl:24px;
  --r6:6px; --r8:8px; --r999:999px;
  --sh:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',-apple-system,sans-serif;background:#B9C9D2;color:var(--g800);
  display:flex;align-items:flex-start;justify-content:center;gap:24px;padding:24px;flex-wrap:wrap}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;
  display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle;-webkit-font-smoothing:antialiased}
.ms-16{font-size:16px}.ms-20{font-size:20px}.ms-24{font-size:24px}.ms-32{font-size:32px}

/* ── Chasis del teléfono ── */
.phone{width:360px;height:800px;background:var(--bg-page);border-radius:20px;overflow:hidden;
  position:relative;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.18);flex-shrink:0}
.sbar{height:32px;background:var(--bg-2);display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp-lg);font-size:var(--b1);font-weight:700;color:#111;flex-shrink:0}
.sbar .ic{display:flex;gap:6px;color:#111}
/* App bar: flecha a la izquierda, título centrado */
.abar{height:48px;background:var(--bg-2);display:flex;align-items:center;padding:0 var(--sp-lg);
  gap:var(--sp-md);flex-shrink:0;position:relative;border-bottom:1px solid var(--g100)}
.abar .bk{background:none;border:none;cursor:pointer;color:var(--brand);display:flex;padding:0}
.abar .ti{position:absolute;left:0;right:0;text-align:center;font-size:var(--t1);line-height:var(--l1);
  font-weight:600;color:var(--g800);pointer-events:none}
/* Sub-barra: "N Operaciones" en itálica + acceso a Filtros */
.sub{height:40px;background:var(--bg-2);display:flex;align-items:center;
  justify-content:space-between;padding:0 var(--sp-lg);flex-shrink:0}
.sub .n{font-size:var(--b1);font-style:italic;color:var(--g600)}
.sub .fl{background:none;border:none;cursor:pointer;font-family:inherit;display:flex;align-items:center;
  gap:6px;font-size:var(--b1);font-weight:700;color:var(--brand)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg-page);padding-bottom:var(--sp-lg)}
/* Bottom nav */
.bnav{height:56px;background:var(--bg-1);border-top:1px solid var(--g100);display:flex;flex-shrink:0}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:var(--mic);color:var(--g500);text-decoration:none;cursor:pointer}
.bnav a .ms{color:var(--g500)}
.bnav a.on,.bnav a.on .ms{color:var(--brand)}
.bnav a.on{font-weight:700}

/* ══ HOME — lista de estados ══ */
.grp-lbl{padding:var(--sp-md) var(--sp-lg) var(--sp-sm);font-size:var(--b1);font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--g500)}
.card-est{background:var(--bg-1);border-radius:var(--r8);margin:0 var(--sp-md);padding:var(--sp-lg) var(--sp-lg) var(--sp-sm);box-shadow:var(--sh)}
.card-est>h2{font-size:18px;line-height:22px;font-weight:400;color:var(--g500);margin-bottom:var(--sp-sm)}
.est-row{display:flex;align-items:center;gap:var(--sp-sm);padding:var(--sp-md) 0;border-top:1px solid var(--g100);
  background:none;border-left:none;border-right:none;border-bottom:none;width:100%;cursor:pointer;font-family:inherit;text-align:left}
.est-row .nm{font-size:var(--t3);line-height:var(--l3);font-weight:700;color:var(--g800)}
.est-row .cn{min-width:20px;height:20px;border-radius:var(--r999);background:var(--g100);color:var(--g600);
  font-size:var(--cap);font-style:italic;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.est-row .ch{margin-left:auto;color:var(--brand)}

/* ══ CARD DE TROPA ══ */
.tc{background:var(--bg-1);border-radius:var(--r8);margin:var(--sp-md) var(--sp-md) 0;overflow:hidden;box-shadow:var(--sh)}
/* el header va sobre gris; el cambio de color hace de separador, no hay línea */
.tc-h{background:var(--bg-2);padding:var(--sp-md) var(--sp-lg);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tc-h .j{font-size:var(--t1);line-height:var(--l1);color:var(--brand)}
.tc-h .c{font-size:var(--t1);line-height:var(--l1);font-weight:700;color:var(--brand)}
.tc-h .k{font-size:var(--t3);line-height:var(--l3);color:var(--g600)}
.tc-h .id{margin-left:auto;font-size:var(--b1);color:var(--g400)}
.tc-r{padding:var(--sp-md) var(--sp-lg);display:flex;align-items:center;gap:var(--sp-md)}
.tc-r .rzcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--sp-sm)}
.tc-r .rz{font-size:var(--b1);line-height:var(--lb1);color:var(--g800)}
.tc-r .tags{display:flex;align-items:center;gap:var(--sp-md);flex-wrap:wrap}
.tc-r .tg{font-size:var(--b1);line-height:var(--lb1);color:var(--g400);
  display:inline-flex;align-items:center;gap:4px}
.tc-r .tg+.tg{border-left:1px solid var(--g100);padding-left:var(--sp-md)}
.tc-r .tg i{font-style:italic}
.btn-vid{flex-shrink:0;background:#E8F4FA;border:none;border-radius:var(--r6);padding:6px 12px;
  cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:var(--mic);color:var(--brand)}
.btn-vid .pl{width:26px;height:18px;border-radius:4px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center}
.btn-vid .pl .ms{color:#fff;font-size:14px}
/* fila de sociedad / establecimiento + "Ver más" */
.tc-e{padding:var(--sp-md) var(--sp-lg);border-top:1px solid var(--g100);display:flex;align-items:center;gap:var(--sp-md)}
.tc-e .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--sp-xs)}
/* una línea por dato: si el nombre no entra, se recorta con puntos suspensivos
   en vez de partirse en dos renglones */
.tc-e .l1,.tc-e .l2{display:flex;align-items:center;gap:6px;min-width:0;
  font-size:var(--b2);line-height:var(--lb2);color:var(--g700);white-space:nowrap}
.tc-e .l1 b,.tc-e .l2 b{overflow:hidden;text-overflow:ellipsis}
.tc-e .loc{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tc-e .l1 b,.tc-e .l2 b{font-weight:700}
.tc-e .loc{font-style:italic;font-weight:400;color:var(--g500)}
.tc-e .ms{color:var(--g400);flex-shrink:0}
.idtropa{flex-shrink:0;font-size:var(--b1);line-height:var(--lb1);color:var(--g400)}
.vermas{flex-shrink:0;background:none;border:none;cursor:pointer;font-family:inherit;display:flex;
  align-items:center;gap:2px;font-size:var(--b1);font-weight:700;color:var(--brand)}
/* dos bloques de fecha */
.fechas{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-sm);padding:var(--sp-md) var(--sp-lg);
  border-top:1px solid var(--g100)}
/* la acción de la card va en su propia banda, separada por un hairline que
   cruza la card entera (como los otros separadores) */
.tc-a{border-top:1px solid var(--g100);padding:var(--sp-md) var(--sp-lg);
  display:flex;flex-direction:column;gap:var(--sp-md)}
.tc-a>*{margin:0!important}
.tc-a .act{margin:0!important;width:100%}
.tc-a .dgrid,.tc-a .pn{margin:0;padding:0}
.tc-a .pn{padding:0}
.tc>.en-card{border-top:1px solid var(--g100);padding-top:var(--sp-md)}
.fbox{background:var(--bg-2);border-radius:var(--r8);padding:var(--sp-md)}
.fbox .d{font-size:var(--t2);line-height:var(--l2);font-weight:700;color:var(--g800)}
.fbox .d span{font-weight:400;color:var(--g500)}
.fbox .l{font-size:var(--cap);line-height:var(--lcap);color:var(--g500);margin-top:2px}
/* pie de canal comercial */
.tc-f{padding:var(--sp-md) var(--sp-lg);border-top:1px solid var(--g100);display:flex;flex-direction:column;gap:6px}
.tc-f .li{display:flex;align-items:center;gap:var(--sp-sm);font-size:var(--b2);line-height:var(--lb2);color:var(--g700)}
.tc-f .li .ms{color:var(--g400)}
/* ── Duplicar y Editar — acción secundaria, misma fila en todos los estados ── */
.dupr{padding:var(--sp-sm) var(--sp-lg) var(--sp-md);border-top:1px solid var(--g100)}
.btn-dup{display:flex;align-items:center;justify-content:center;gap:var(--sp-sm);width:100%;min-height:40px;
  background:none;border:1px solid var(--brand-light);border-radius:var(--r8);cursor:pointer;font-family:inherit;
  font-size:var(--b1);line-height:var(--lb1);font-weight:700;color:var(--brand)}
.btn-dup .ms{color:var(--brand)}
/* en Cerradas el botón viaja dentro del aviso de beneficio */
.dupbox{margin:var(--sp-md) var(--sp-lg);background:var(--brand-light-2,#F1F8FC);border:1px solid var(--brand-light);
  border-radius:var(--r8);padding:var(--sp-md);display:flex;flex-direction:column;gap:var(--sp-sm)}
.dupbox .hd{display:flex;gap:var(--sp-sm);align-items:flex-start}
.dupbox .hd .ms{color:var(--brand);flex-shrink:0}
.dupbox b{display:block;font-size:var(--b1);line-height:var(--lb1);color:var(--g800)}
.dupbox p{font-size:var(--b2);line-height:1.5;color:var(--g600);margin-top:2px}
.dupbox .btn-dup{background:var(--bg-1)}
.dcp-m{width:20px;height:20px;border-radius:var(--r999);background:rgba(255,255,255,.22);color:#fff;
  font-size:8px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:-.3px}
.dcac{width:16px;height:16px;border-radius:var(--r999);background:var(--brand);color:#fff;font-size:7px;
  font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:-.3px}

/* ── Acciones ── */
.act{margin:0 var(--sp-lg) var(--sp-md);display:flex;align-items:center;justify-content:center;gap:var(--sp-sm);
  width:calc(100% - 32px);min-height:44px;border-radius:var(--r8);border:none;cursor:pointer;font-family:inherit;
  font-size:var(--t3);line-height:var(--l3);font-weight:700}
.act.pri{background:var(--brand);color:#fff}
.act.pri .ms{color:#fff}
.act.dcp{background:var(--dcp);color:#fff}
.act.dcp .ms{color:#fff}
.act.gh{background:#EAF2F6;color:var(--brand)}
.act.gh .ms{color:var(--brand)}
.act.gh{font-weight:700}
.act.doc{background:var(--verde50);color:var(--verde200)}
.act.doc .ms{color:var(--verde200)}
.act.wa{background:var(--verde-wa);color:#fff}
.act.wa .ms{color:#fff}

/* ── Paneles de datos del detalle ── */
.pn{background:var(--bg-2);border-radius:var(--r8);margin:var(--sp-md) var(--sp-md) 0;overflow:hidden}
/* el mismo panel, pero adentro de una card de la lista: los márgenes laterales
   los pone la card, no el panel */
.en-card .pn{margin:0 var(--sp-lg) var(--sp-md)}
.en-card .act{margin:0 var(--sp-lg) var(--sp-md);width:calc(100% - 32px)}
.pn>h3{padding:var(--sp-md);text-align:center;font-size:var(--b2);line-height:var(--lb2);font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--g500)}
.pn-b{background:var(--bg-1);border-radius:var(--r8);margin:0 var(--sp-sm) var(--sp-sm);padding:0 var(--sp-md)}
.pr{padding:var(--sp-md) 0;border-top:1px solid var(--g100)}
.pr:first-child{border-top:none}
.pr.np{border-top:none;padding-top:0}
.pr .l{font-size:var(--b2);line-height:var(--lb2);color:var(--g500)}
.pr .v{font-size:var(--t3);line-height:var(--l3);font-weight:700;color:var(--g800);margin-top:2px}
.pr .s{font-size:var(--b2);line-height:var(--lb2);color:var(--g500);font-style:italic}
.pr .m{font-size:var(--b2);line-height:var(--lb2);color:var(--g600);margin-top:2px}
/* fila de dos columnas dentro de un panel */
.pr.two{display:flex;justify-content:space-between;gap:var(--sp-md)}
.pr.two>div:last-child{text-align:right}
/* tres columnas: Encierre · Balanza · Desbaste, con caption debajo del valor */
.pr.tres{display:grid;grid-template-columns:1fr auto auto;gap:var(--sp-md);align-items:start}
.pr.tres>div:nth-child(2){text-align:center}
.pr.tres>div:last-child{text-align:right}
.pr.tres .s{font-style:normal;color:var(--g400);font-size:var(--cap)}
/* bloque del operador */
/* cuerpo del detalle: todo adentro de la card, en bloques separados por 12 */
.det{padding:var(--sp-lg);display:flex;flex-direction:column;gap:var(--sp-md);border-top:1px solid var(--g100)}
.det>.pn,.det>.gb,.det>.canal,.det>.oper{margin:0}
.det>.fechas{padding:0;border-top:none}
.det>.act{margin:0;width:100%}
.det .dgrid{padding:0;margin:0}
.dtenro{font-size:var(--b1);line-height:var(--lb1);font-weight:700;color:var(--g500)}
/* DTE NRO + acción: el aire lo pone el flex del bloque, no el margen del botón
   — dentro de la card del listado los márgenes de los .act se anulan */
.gb.dte{display:flex;flex-direction:column;gap:var(--sp-md)}
.gb.dte .dtenro{letter-spacing:.04em;text-transform:uppercase;color:var(--g400)}
.gb.dte .dtenro b{color:var(--g800);letter-spacing:normal}
.gb.dte .act{margin:0!important;width:100%}
.acargo{font-size:var(--b1);line-height:var(--lb1);font-weight:700;color:var(--g500);margin-top:2px}
/* Canal Comercial: caja blanca con borde y la marca de agua de dCaC */
.canal{position:relative;background:var(--bg-1);border:1px solid var(--g100);border-radius:var(--r8);
  padding:var(--sp-md);display:flex;flex-direction:column;gap:var(--sp-md)}
.canal .wm{position:absolute;top:var(--sp-md);right:var(--sp-md);font-family:Georgia,serif;
  font-size:18px;font-weight:700;color:var(--g100);letter-spacing:-1px}
.canal .cl .l{font-size:var(--b2);line-height:var(--lb2);color:var(--g500)}
.canal .cl .v{font-size:var(--b1);line-height:var(--lb1);font-weight:700;color:var(--g800);margin-top:2px}

.oper{background:var(--bg-2);border-radius:var(--r8);padding:var(--sp-md);
  display:flex;align-items:center;gap:var(--sp-md)}
.oper .av{width:36px;height:36px;border-radius:var(--r999);background:var(--g100);display:flex;
  align-items:center;justify-content:center;color:var(--g500);flex-shrink:0}
.oper .tx{flex:1;min-width:0}
.oper .l{display:block;font-size:var(--b2);line-height:var(--lb2);color:var(--g500)}
.oper .n{display:block;font-size:var(--t3);line-height:var(--l3);font-weight:700;color:var(--g800)}
.oper .ct{background:none;border:none;cursor:pointer;font-family:inherit;font-size:var(--b1);
  font-weight:700;color:var(--brand)}
/* grilla de datos (Faenadas) */
/* en Cerradas los documentos van apilados a lo ancho, uno por fila */
.btn-col{display:flex;flex-direction:column;gap:var(--sp-sm)}
.btn-col .act{margin:0;width:100%}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-sm);padding:0 var(--sp-md);margin-top:var(--sp-md)}
.dbox{background:var(--bg-2);border-radius:var(--r8);padding:var(--sp-md)}
.dbox .l{font-size:var(--b2);line-height:var(--lb2);color:var(--g500)}
.dbox .v{font-size:var(--t3);line-height:var(--l3);font-weight:700;color:var(--g800);margin-top:2px}
.dbox .v .u{font-size:var(--b2);font-weight:400;color:var(--g500)}
.dbox.warn .v{color:var(--rojo)}
/* aviso amarillo */
.warnbox{margin:var(--sp-md) var(--sp-md) 0;background:var(--amar-bg);border:1px solid var(--amar-bd);
  border-radius:var(--r8);padding:var(--sp-md);display:flex;gap:var(--sp-sm);
  font-size:var(--b2);line-height:1.5;color:var(--amar-tx);font-style:italic}
.warnbox .ms{color:#A3972A;flex-shrink:0}
/* aviso azul con puntero (dCampoPagos) */
.infobox{margin:var(--sp-md) var(--sp-md) 0;background:var(--bg-1);border:1px solid var(--brand-light);
  border-radius:var(--r8);padding:var(--sp-md);display:flex;gap:var(--sp-sm)}
.infobox .ms{color:var(--brand);flex-shrink:0}
.infobox b{display:block;font-size:var(--b1);line-height:var(--lb1);color:var(--g800)}
.infobox p{font-size:var(--b2);line-height:1.5;color:var(--g600);margin-top:2px}
/* caja de aclaraciones */
.aclar{background:var(--bg-1);border:1px solid var(--g100);
  border-radius:var(--r8);padding:var(--sp-md)}
.aclar h4{display:flex;align-items:center;gap:6px;font-size:var(--b1);line-height:var(--lb1);
  font-style:italic;font-weight:400;color:var(--g600);margin-bottom:var(--sp-sm)}
.aclar h4 .ms{color:var(--g400)}
.aclar p{font-size:var(--b2);line-height:1.6;font-style:italic;color:var(--g600)}

/* ── INFORME COMPLETO — acordeón ── */
.inf-t{padding:var(--sp-lg) var(--sp-md) var(--sp-sm);font-size:var(--b1);line-height:var(--lb1);
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--g500)}
/* Cada sección es una tarjeta: gris clara cuando está cerrada, blanca cuando
   se abre. El título va en azul brand, no sobre una barra celeste. */
.sec{margin:0 var(--sp-md) var(--sp-sm);background:var(--bg-2);border-radius:var(--r8);overflow:hidden}
.sec.open{background:var(--bg-1);box-shadow:var(--sh)}
.sec>h4{padding:var(--sp-lg);display:flex;align-items:center;gap:var(--sp-sm);
  font-size:var(--b1);line-height:var(--lb1);font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--brand);cursor:pointer}
.sec>h4 .ms{margin-left:auto;color:var(--brand);transition:transform .18s ease}
.sec.open>h4 .ms{transform:rotate(180deg)}
/* misma técnica que en web: 0fr → 1fr anima hasta la altura natural */
.sec-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.sec.open .sec-b{grid-template-rows:1fr}
.sec-b>div{overflow:hidden;min-height:0}
.sb{padding:0 var(--sp-lg) var(--sp-lg)}
/* cajitas grises de dato: label chico arriba, valor en bold. Sin ícono. */
.gb{background:var(--bg-2);border-radius:var(--r8);padding:var(--sp-md)}
.sec.open .gb{background:var(--bg-2)}
.gb .l{font-size:var(--b2);line-height:var(--lb2);color:var(--g500)}

/* ══════════════════════════════════════════════════════════════
   NAVEGACIÓN — el Figma mobile no usa pestañas: la Home lista los
   estados con su contador y cada uno abre su propia pantalla; desde
   la lista se entra al detalle de la operación.
   ══════════════════════════════════════════════════════════════ */
const NOMBRE={vendidas:'Vendidas',acargar:'A Cargar',cargadas:'Cargadas',
  faenadas:'Faenadas',saldo:'Operaciones con Saldo',cerradas:'Cerradas'};
const ORDEN=['vendidas','acargar','cargadas','faenadas','saldo','cerradas'];
let vista={t:'home'};
const pila=[];

function ir(v,push=true){ if(push&&vista) pila.push(vista); vista=v; render(); }
/* Los botones de adentro de la card (Compartir Datos, Adjuntar DTE, Ver DTE…)
   son acciones propias: no tienen que abrir el detalle. */
function abrirDet(ev,st,i){ if(ev.target.closest('button')) return; ir({t:'det',e:st,i:i}); }
function atras(){ if(pila.length){ vista=pila.pop(); render(); } }

/* ── helpers de formato ── */
const DIAS=['dom.','lun.','mar.','mié.','jue.','vie.','sáb.'];
function fechaCorta(f){                 /* "14/09/2026" → "lun. 14 / 09" */
  if(!f||!/^\d{2}\/\d{2}\/\d{4}$/.test(f)) return {d:f||'—',s:''};
  const [d,m,a]=f.split('/');
  const dia=DIAS[new Date(+a,+m-1,+d).getDay()];
  return {d:dia+' '+d, s:' / '+m};
}
const soloNum=v=>parseFloat(String(v||'').replace(/\./g,'').replace(/[^\d]/g,''))||0;
const rindeCampo=t=>{const n=soloNum(t.neto),c=soloNum(t.carne);return n&&c?Math.round(c/n*100):null;};
const encierreDe=t=>t.encierre||'Sin Encierre';

/* ══════════════════════════════════════════════════════════════
   PIEZAS DE LA CARD
   ══════════════════════════════════════════════════════════════ */
function head(t,conId){
  return `<div class="tc-h"><span class="j">${t.jaula||t.cab+' cab.'}</span>
    <span class="c">${t.cat}</span><span class="k">${t.kg}</span>
    ${conId?`<span class="id">#${t.id}</span>`:''}</div>`;
}
/* Raza + tag de Feedlot con los días de encierre, y el botón de video.
   Consumo y Apto China no van en porcinos (comparativa, filas 2-3);
   Feedlot sí, con los días. */
function raza(t){
  return `<div class="tc-r"><span class="rzcol">
      <span class="rz">${t.raza}</span>
      <span class="tags"><span class="tg">Feedlot <i>${t.dias||'30 días'}</i></span></span>
    </span>
    <button class="btn-vid"><span class="pl"><span class="ms">play_arrow</span></span>Video</button></div>`;
}
/* En la lista cierra con "Ver más"; en el detalle, con el número de tropa
   (adentro ya estás en la operación, así que no hay adónde ampliar). */
function estab(t,modo,st,i){
  const der = modo==='id'
    ? `<span class="idtropa">#${t.id}</span>`
    : `<button class="vermas" onclick="ir({t:'det',e:'${st}',i:${i}})">Ver más<span class="ms ms-16">chevron_right</span></button>`;
  return `<div class="tc-e"><span class="col">
      <span class="l1"><span class="ms ms-16">sell</span><b>${t.soc}</b></span>
      <span class="l2"><span class="ms ms-16">location_on</span><b>${t.est}</b><span class="loc">${t.loc}</span></span>
    </span>${der}</div>`;
}
function fechas(t){
  const c=fechaCorta(t.fCarga), f=fechaCorta(t.fFaena);
  return `<div class="fechas">
    <div class="fbox"><div class="d">${c.d}<span>${c.s}</span></div><div class="l">Fecha de Carga</div></div>
    <div class="fbox"><div class="d">${f.d}<span>${f.s}</span></div><div class="l">Fecha de Faena</div></div>
  </div>`;
}
/* soloComprador: en A Cargar la card cierra con la matrícula compradora nada más */
function canal(t,soloComprador){
  return `<div class="tc-f">
    ${soloComprador?'':`<span class="li"><span class="dcac">dCaC</span>deCampoaCampo</span>`}
    <span class="li"><span class="ms ms-16">shopping_cart</span>${t.comprador}</span></div>`;
}
/* ── Duplicar y Editar ───────────────────────────────────────────
   Acción secundaria disponible en TODAS las tropas, en cualquier estado:
   abre el formulario de digitalización con los datos de la tropa ya
   cargados. Vive al pie de la card — la única fila que existe igual en
   los seis estados — para no competir con la acción principal de cada uno.
   En Cerradas no va suelta: viaja dentro del aviso que explica el beneficio.
   Este prototipo no incluye el formulario de digitalización (vive en el
   proyecto venta-porcinos), así que acá el botón no dispara nada. */
const btnDup=()=>`<button class="btn-dup" onclick="event.stopPropagation()">
    <span class="ms ms-20">content_copy</span>Duplicar y Editar</button>`;

const pieDup=(t,st,i)=>st==='cerradas'
  ? `<div class="dupbox">
      <div class="hd"><span class="ms ms-20">content_copy</span>
        <div><b>¿Volvés a vender lo mismo?</b>
        <p>Duplicá esta tropa y digitalizá la próxima operación con el comprador, la categoría, las condiciones y el flete ya cargados. Después editás sólo lo que cambie.</p></div></div>
      ${btnDup()}
    </div>`
  : `<div class="dupr">${btnDup()}</div>`;

function operador(t,st){
  const rol=(st==='acargar'||st==='cargadas')?'Responsable de Carga':'Operador';
  return `<div class="oper"><span class="av"><span class="ms ms-24">person</span></span>
    <span class="tx"><span class="l">${rol}</span><span class="n">${t.oper}</span></span>
    <button class="ct">Contactar</button></div>`;
}
const prow=(l,v,sub,extra)=>`<div class="pr"><div class="l">${l}</div><div class="v">${v}</div>
  ${sub?`<div class="s">${sub}</div>`:''}${extra?`<div class="m">${extra}</div>`:''}</div>`;
const prow2=(l1,v1,l2,v2)=>`<div class="pr two">
  <div><div class="l">${l1}</div><div class="v">${v1}</div></div>
  <div><div class="l">${l2}</div><div class="v">${v2}</div></div></div>`;
const dbox=(l,v,u,warn)=>`<div class="dbox${warn?' warn':''}"><div class="l">${l}</div>
  <div class="v">${v}${u?`<span class="u"> ${u}</span>`:''}</div></div>`;

/* Panel DTE/DUT — igual en Vendidas, A Cargar y Cargadas */
/* Los tres actores llevan CUIT y ONCCA, como en el Figma: label chico,
   nombre en bold, localidad en itálica y las dos líneas de identificación. */
const ids=(cuit,oncca)=>`CUIT: ${cuit||'—'}<br/>ONCCA: ${oncca||'—'}`;
function panelDte(t){
  const f=FAENADOR[t.faenador]||{};
  return `<div class="pn"><h3>Datos para la emisión de DTE/DUT</h3><div class="pn-b">
    ${prow('Establecimiento Faenador',t.faenador,t.faenLoc,ids(f.cuit,f.oncca))}
    ${prow('Datos Consignatario',t.consig,'',ids(t.consigCuit||CONSIG.cuit,CONSIG.oncca))}
    ${prow('Datos de Faena',t.soc,'',ids(CUIT_SOC[t.soc],ONCCA_SOC[t.soc]))}
    ${prow2('Motivo','Faena','Fecha de Carga',t.fCarga)}
    <div class="pr np"><button class="act wa" style="margin:0;width:100%">
      <span class="ms ms-20">chat</span>Compartir Datos</button></div>
  </div></div>`;
}
/* Bloque de flete que cierra el detalle */
function bloqueFlete(t,st){
  const flete=st==='vendidas'?'En Planta':(t.transporte||'Transporte Porcino SRL');
  return `<div class="gb"><div class="l">Flete</div><div class="v">${flete}</div>
    <div class="acargo">A Cargo de dCaC</div></div>`;

function bloqueCanal(t,st){
  return `<div class="canal"><span class="wm">dCaC</span>
    <div class="cl"><div class="l">Canal Comercial</div><div class="v">deCampoaCampo</div></div>

  </div>`;
}

   INFORME COMPLETO — mismas secciones y reglas que en web

const fc=(ic,l,v,u,bdg)=>`<div class="fc${bdg?' bdg-on':''}">${bdg?`<span class="bdg">${bdg}</span>`:''}
  <span class="ic"><span class="ms ms-20">${ic}</span></span>
  <span><div class="l">${l}</div><div class="v">${v}${u?`<span class="u"> ${u}</span>`:''}</div></span></div>`;

const gb=(l,v,sub,neg,centrada)=>`<div class="gb${neg?' neg':''}${centrada?' c':''}">
  <div class="l">${l}</div><div class="v">${v}</div>${sub?`<div class="s">${sub}</div>`:''}</div>`;
const promedio=t=>{const n=soloNum(t.neto),c=parseInt(t.cant||0,10);
  return n&&c?Math.round(n/c)+' Kg':'—';};

    `<div class="sec${i===0?' open':''}"><h4 onclick="this.parentElement.classList.toggle('open')">${ti}
      <span class="ms ms-20">expand_more</span></h4>
      <div class="sec-b"><div><div class="sb">${b}</div></div></div></div>`).join('');
}

/* ══════════════════════════════════════════════════════════════
   PANTALLAS
   ══════════════════════════════════════════════════════════════ */
function vHome(){
  return `<div class="grp-lbl">Faena</div>
    <div class="card-est"><h2>Ventas</h2>
      ${ORDEN.map(k=>`<button class="est-row" onclick="ir({t:'lista',e:'${k}'})">
        <span class="nm">${NOMBRE[k]}</span><span class="cn">${filtradas(k).length}</span>
        <span class="ms ms-20 ch">chevron_right</span></button>`).join('')}
    </div>
    <div style="height:16px"></div>`;
}

function vLista(st){
  const arr=filtradas(st);
  const hoy=st==='acargar'?`<div class="grp-lbl">Cargas de hoy</div>`:'';
  const busc=st==='cerradas'
    ? `<div class="busc"><span class="ms ms-20">search</span>
        <input placeholder="ID #####"/></div>`:'';
  if(!arr.length) return busc+`<div class="empty">Ninguna operación coincide con los filtros aplicados.</div>`;
  /* Cerradas agrupa por período; el separador va entre la primera card y el resto */
  const grupo=k=>st==='cerradas'?(k===0?`<div class="grp-lbl">Último mes</div>`
    :(k===1?`<div class="grp-lbl">Meses anteriores</div>`:'')):'';
  return busc+hoy+arr.map((t,k)=>{const i=D[st].indexOf(t);return grupo(k)+`<div class="tc" onclick="abrirDet(event,'${st}',${i})">
      ${head(t)}
      ${raza(t)}
      ${estab(t,'',st,i)}
      ${fechas(t)}
      ${(()=>{const c=cuerpoEstado(t,st,i,true);return c?`<div class="tc-a">${c}</div>`:'';})()}
      ${canal(t,st==='acargar')}
      ${pieDup(t,st,i)}
    </div>`;}).join('')+
    `<div class="empty">No hay más operaciones de porcinos en este estado.</div>`;
}

/* El cuerpo propio de cada estado. En el Figma la card del listado ya lo trae:
   la de Faenadas muestra la grilla de datos, la de Op. con Saldo el panel de
   Condiciones actuales, etc. Por eso lo usan tanto la lista como el detalle. */
function cuerpoEstado(t,st,i,esLista){
  let cuerpo='';
  /* En Cerradas la card del listado sólo anticipa el ajuste, si lo hubo:
     el panel de condiciones y los cuatro documentos son del detalle. */
  if(st==='cerradas'&&esLista)
    return t.ajuste?`<button class="act doc"><span class="ms ms-20">bolt</span>Ver Ajuste Por Mod. de Plazo</button>`:'';

  if(st==='vendidas'||st==='acargar'){
    cuerpo=(st==='acargar'&&!t.dteOk?`<div style="height:12px"></div>
        <button class="act gh"><span class="ms ms-20">upload_file</span>Adjuntar DTE</button>`:'')
      + panelDte(t)
      ;   /* Condiciones de Pesada vive dentro de Condiciones pactadas */
  }

  if(st==='cargadas'){
    /* El DTE es la llave del estado: sin DTE no hay datos de origen que cargar.
       · La card del listado muestra UNA sola acción, la que toca ahora:
           sin DTE                → Cargar DTE
           con DTE, sin datos     → DTE NRO + Cargar Datos de Origen
           con DTE y datos        → el panel de Datos de origen, sin acción
       · El detalle muestra los dos documentos: en azul mientras faltan
         (Cargar…) y en verde una vez cargados (Ver…). */
    const cargarDte=`<button class="act gh"><span class="ms ms-20">upload_file</span>Cargar DTE</button>`;
    const panelOrigen=`<div class="pn"><h3>Datos de origen</h3><div class="pn-b">
        ${prow2('Cabezas',t.cant,'Peso Bruto',t.bruto)}
        ${prow2('Desbaste',t.desbaste,'Peso Neto',t.neto)}
        ${prow2('Hora de Carga',t.hCarga,'Hora de Pesada',t.hPesada)}
      </div></div>`;
    /* el número de DTE encabeza el panel de la acción, como en el Figma */
    const cargarOrigen=`<div class="gb dte"><div class="dtenro">DTE NRO: <b>${t.dte||'000047678-3'}</b></div>
        <button class="act pri" onclick="abrirModal(${i},'cargadas')">Cargar Datos de Origen</button></div>`;

    if(esLista) return t.dteOk ? (t.sinDatos?cargarOrigen:panelOrigen) : cargarDte;

    /* sin DTE no se puede cargar el origen: el detalle arranca por el DTE */
    cuerpo = (t.sinDatos?(t.dteOk?cargarOrigen:''):panelOrigen)
      + (t.dteOk
          ? `<button class="act doc" style="margin-top:var(--sp-md)"><span class="ms ms-20">description</span>Ver DTE</button>`
          : `<div style="margin-top:var(--sp-md)">${cargarDte}</div>`)
      + (t.ticketOk
          ? `<button class="act doc" style="margin-top:var(--sp-sm)"><span class="ms ms-20">receipt</span>Ver Ticket de Pesada</button>`
          : `<button class="act gh" style="margin-top:var(--sp-sm)"><span class="ms ms-20">upload_file</span>Cargar Ticket de Pesada</button>`);
  }

  if(st==='faenadas'){
    cuerpo=`<div class="dgrid">
        ${dbox('Neto en Origen',t.neto)}
        ${dbox('Kg Carne',t.carne)}
        ${dbox('Rinde Campo',rindeCampo(t)??'—','%')}
        ${dbox('Magro',t.magro,'%',t.magro<56)}
      </div>
      ${esLista?'':`<div class="pn"><div class="pn-b" style="margin-top:var(--sp-sm)">
        ${prow('Establecimiento Faenador',t.faenador,t.faenLoc)}
      </div></div>`}
      <button class="act doc" style="margin-top:var(--sp-md)"><span class="ms ms-20">fact_check</span>Ver Romaneo</button>`;
  }

  if(st==='saldo'){
    /* Dos acciones distintas de dCP, con nombres que no se mezclan:
       · Cobrar por deCampoPagos — cobro anticipado del saldo. Va en el detalle,
         arriba, junto al aviso "Disponé de tu dinero hoy".
       · Programar Pago — sólo en las operaciones habilitadas (`pago`). Va al pie
         de la botonera del detalle y como acción de la card del listado.
       La card del listado muestra una sola: Programar Pago si la operación lo
       tiene, y si no el cobro anticipado. */
    const panel=`<div class="pn"><h3>Condiciones actuales</h3><div class="pn-b">
        ${prow2('Precio','$ '+t.precio,'Plazo',t.plazo)}
        ${prow2('Saldo Disponible','$ '+t.saldo,'Vencimiento Inicial',t.venc)}
        ${prow('Número de Factura',t.factura)}
      </div></div>`;
    const cobrar=`<button class="act dcp"><span class="dcp-m">dCP</span>Cobrar por deCampoPagos</button>`;
    const programar=`<button class="act dcp"><span class="dcp-m">dCP</span>Programar Pago</button>`;
    if(esLista) return panel+(t.pago?programar:cobrar);
    cuerpo=`<div class="infobox"><span class="ms ms-20">info</span>
        <div><b>Disponé de tu dinero hoy</b><p>Solicitá el cobro mediante nuestra plataforma de pagos y usá tu saldo hoy mismo.</p></div></div>
      ${cobrar}`
      + panel
      + `<div class="btn-col">
          <button class="act doc"><span class="ms ms-20">receipt_long</span>Ver Liquidación</button>
          <button class="act doc"><span class="ms ms-20">edit_note</span>Ver Nota de Ajuste</button>
          <button class="act doc"><span class="ms ms-20">fact_check</span>Ver Romaneo</button>
          ${t.pago?programar:''}
        </div>`;
  }

  if(st==='cerradas'){
    cuerpo=`<div class="pn"><h3>Condiciones resultantes</h3><div class="pn-b">
        ${prow2('Precio','$ '+t.precio,'Plazo',t.plazo)}
        ${prow2('Importe Neto','$ '+t.importe,'Magro Final',t.magro+' %')}
        ${prow('Número de Factura',t.factura)}
      </div></div>
      <div class="btn-col">
        <button class="act doc"><span class="ms ms-20">bolt</span>Ver Ajuste Por Mod. de Plazo</button>
        <button class="act doc"><span class="ms ms-20">receipt_long</span>Ver Liquidación</button>
        <button class="act doc"><span class="ms ms-20">edit_note</span>Ver Nota de Ajuste</button>
      </div>`;
  }

  return cuerpo;
}

function vDetalle(st,i){
  const t=D[st][i];
  const cuerpo=cuerpoEstado(t,st,i);
  return `<div class="tc" style="margin-top:var(--sp-md)">
      ${head(t)}
      ${raza(t)}
      ${estab(t,'id')}
      <div class="det">
        ${operador(t,st)}
        ${fechas(t)}
        ${cuerpo}
        ${st==='cerradas'?'':bloqueFlete(t,st)}
        ${bloqueCanal(t,st)}
        <div class="aclar"><h4><span class="ms ms-20">feedback</span>Aclaraciones y Comentarios</h4>
          <p>Jaula ${t.jaula||'—'}. El flete lo coordina dCaC.<br/>
          Magro mínimo aceptado por el comprador: 56 %.</p></div>
      </div>
      ${pieDup(t,st,i)}
    </div>
    ${informe(t,st)}
    <div style="height:24px"></div>`;
}

/* ══════════════════════════════════════════════════════════════
   FILTROS — mismo contenido que el Figma, con datos porcinos
   ══════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   FILTROS — filtran de verdad. Las opciones salen de las tropas
   cargadas, así que la lista nunca ofrece algo que no exista.
   Un grupo sin nada tildado (o con "Todas") no filtra.
   ══════════════════════════════════════════════════════════════ */
const GRUPOS=[
  {k:'soc',   t:'Sociedad',        todas:'Todas', val:t=>t.soc},
  {k:'est',   t:'Establecimiento', todas:'Todos', val:t=>t.est+'. '+t.loc+'.', comp:t=>t.est},
  {k:'cat',   t:'Categoría',       todas:'Todas', val:t=>t.cat},
  {k:'canal', t:'Canal Comercial', todas:null,    val:()=>'deCampoaCampo'},
];
const sel={soc:new Set(),est:new Set(),cat:new Set(),canal:new Set()};

function opciones(g){
  const vistos=new Map();
  ORDEN.forEach(k=>D[k].forEach(t=>{
    const comp=(g.comp||g.val)(t);
    if(!vistos.has(comp)) vistos.set(comp,g.val(t));
  }));
  return [...vistos.entries()];              /* [valor de comparación, etiqueta] */
}
function pasa(t){
  return GRUPOS.every(g=>{
    const s=sel[g.k];
    if(!s.size) return true;
    return s.has((g.comp||g.val)(t));
  });
}
const filtradas=st=>D[st].filter(pasa);
const activos=()=>GRUPOS.filter(g=>sel[g.k].size).length;
const totalFiltrado=()=>ORDEN.reduce((a,k)=>a+filtradas(k).length,0);

function pintarFiltros(){
  document.getElementById('shb').innerHTML=GRUPOS.map(g=>{
    const s=sel[g.k];
    const todas=g.todas?`<label class="chk${s.size?'':' on'}" data-g="${g.k}">
        <span class="bx"><span class="ms">check</span></span>${g.todas}</label>`:'';
    return `<div class="sh-g"><h3>${g.t}</h3>${todas}${opciones(g).map(([v,lbl])=>
      `<label class="chk${s.has(v)?' on':''}" data-g="${g.k}" data-v="${esc(v)}">
        <span class="bx"><span class="ms">check</span></span>${lbl}</label>`).join('')}</div>`;
  }).join('');
  document.getElementById('fres').textContent=totalFiltrado();
}
const esc=v=>String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
/* Delegación: cada opción lleva data-g (grupo) y data-v (valor). Antes iba por
   onclick inline y las comillas del valor cortaban el atributo. */
document.getElementById('shb').addEventListener('click',ev=>{
  const l=ev.target.closest('.chk'); if(!l) return;
  ev.preventDefault();
  marcar(l.dataset.g, l.dataset.v===undefined?null:l.dataset.v);
});
function marcar(k,v){
  if(v===null) sel[k].clear();               /* "Todas" limpia el grupo */
  else sel[k].has(v)?sel[k].delete(v):sel[k].add(v);
  pintarFiltros();
}
function abrirFiltros(){pintarFiltros();document.getElementById('sheet').classList.add('open');}
function cerrarFiltros(){
  document.getElementById('sheet').classList.remove('open');
  render();                                   /* aplica lo tildado */
}
function limpiarFiltros(){GRUPOS.forEach(g=>sel[g.k].clear());pintarFiltros();}

/* ══════════════════════════════════════════════════════════════
   MODAL — Cargar Datos de Origen (Modals Faena · Mobile)
   ══════════════════════════════════════════════════════════════ */
function abrirModal(i,st){
  const t=D[st][i];
  document.getElementById('mtit').textContent='Datos de Origen';
  document.getElementById('mchip').innerHTML=
    `<span class="j">${t.jaula||''}</span> <span class="c">${t.cat}</span> <span class="k">${t.kg}</span>`;
  document.getElementById('mbody').innerHTML=`
    <div class="pn"><h3>Datos de origen</h3><div class="pn-b" style="padding:var(--sp-md)">
      <div class="fld"><label>Cantidad Total</label>
        <div class="inp"><input placeholder="0"/><span class="u">Cab.</span></div></div>
      <div class="f2">
        <div class="fld"><label>Kilos Salida Brutos</label>
          <div class="inp"><input value="12.500"/><span class="u">kg</span></div></div>
        <div class="fld"><label>Desbaste</label>
          <div class="inp"><input value="2,5"/><span class="u">%</span></div></div>
      </div>
      <div class="neto">12.187 <span>kg Salida Netos</span></div>
      <div class="f2">
        <div class="fld"><label>Tipo de balanza</label>
          <div class="inp"><select><option>Sociedad Rural</option><option>Pública</option><option>Establecimiento</option></select></div></div>
        <div class="fld"><label>Fecha de Carga</label>
          <div class="inp"><input value="${t.fCarga}"/></div></div>
      </div>
      <div class="f2">
        <div class="fld"><label>Hora de Carga</label>
          <div class="inp"><input value="07:30"/></div></div>
        <div class="fld"><label>Hora de Pesada</label>
          <div class="inp"><input value="07:10"/></div></div>
      </div>
      <div class="f2">
        <button class="adj"><span class="ms ms-24">upload_file</span><span>Adjuntar<b>Ticket de Pesada</b></span></button>
        <button class="adj"><span class="ms ms-24">upload_file</span><span>Adjuntar<b>Imagen de DTE</b></span></button>
      </div>
      <div class="warnbox" style="margin:var(--sp-md) 0 0"><span class="ms ms-20">error</span>
        <span>Recordá que en la imagen debe verse el N.º de DTE, la Fecha de Carga y las Categorías claramente.</span></div>
    </div></div>
    <button class="act wa" style="margin-top:var(--sp-md)">Guardar Datos de Origen</button>
    <div style="height:24px"></div>`;
  document.getElementById('modal').classList.add('open');
}
function cerrarModal(){document.getElementById('modal').classList.remove('open');}

/* ══════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════ */
function render(){
  const scr=document.getElementById('scr');
  const tit=document.getElementById('titulo');
  const sub=document.getElementById('subbar');
  const n=activos();
  document.getElementById('fcount').textContent=n?` (${n})`:'';
  if(vista.t==='home'){
    tit.textContent='Mis Operaciones';
    document.getElementById('subn').textContent=totalFiltrado()+' Operaciones';
    sub.style.display='flex'; scr.innerHTML=vHome();
  }else if(vista.t==='lista'){
    tit.textContent=NOMBRE[vista.e];
    document.getElementById('subn').textContent=filtradas(vista.e).length+' Operaciones';
    sub.style.display='flex'; scr.innerHTML=vLista(vista.e);
  }else{
    tit.textContent='Operación #'+D[vista.e][vista.i].id;
    sub.style.display='none'; scr.innerHTML=vDetalle(vista.e,vista.i);
  }
  scr.scrollTop=0;
}
pintarFiltros();
render();
</script>
</body>
</html>
